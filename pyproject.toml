[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkformer"
version = "2.0.0"
description = "BulkFormer-Atlas sample representations and BulkFormer-Latest contextual gene representations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "torch>=2.5,<3", "performer-pytorch==1.1.4", "torch-geometric>=2.6,<3", "gdown>=6.4.2,<7", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bulkformer = ["manifests/*.json"]
